user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

load_module /etc/nginx/modules/libngx_l402_lib.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen 8000;
        listen [::]:8000;
        server_name _;

        # -- CORS for the in-browser demo widget on ngx-l402.org ------------
        # `always` is required: without it nginx drops these headers on 402
        # responses, and the browser can't read WWW-Authenticate.
        add_header Access-Control-Allow-Origin  $http_origin              always;
        add_header Access-Control-Allow-Headers "Authorization, X-Cashu"  always;
        add_header Access-Control-Expose-Headers "WWW-Authenticate, X-Cashu" always;

        location / {
            default_type application/json;
            return 200 '{"service":"ngx-l402 demo gateway","paid_route":"/protected","price_sats":1,"docs":"https://ngx-l402.org"}';
        }

        # Paid route: 1 sat. The image ships a static page at this path.
        location /protected {
            root /usr/share/nginx/html;

            l402                      on;
            l402_amount_msat_default  1000;    # 1 sat — demo pricing
            l402_macaroon_timeout     0;
            l402_invoice_rate_limit   10r/m;   # invoice-spam guard, per IP

            # nginx inherits add_header from the server block only when this
            # block declares none of its own, so the CORS headers have to be
            # repeated here alongside Cache-Control — otherwise they vanish from
            # exactly the route the widget calls.
            add_header Access-Control-Allow-Origin  $http_origin              always;
            add_header Access-Control-Allow-Headers "Authorization, X-Cashu"  always;
            add_header Access-Control-Expose-Headers "WWW-Authenticate, X-Cashu" always;

            # Don't let browsers cache the unlocked page — every visitor should
            # see the 402 → pay flow fresh, not a cached "This is Protected Content".
            add_header Cache-Control "no-store" always;

            # CORS preflight must answer before the l402 access phase.
            if ($request_method = OPTIONS) { return 204; }

            try_files $uri $uri/index.html =404;
        }

        # Agent discovery.
        location = /.well-known/l402-services {
            l402_manifest;
        }
    }
}
