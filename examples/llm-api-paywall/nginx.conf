user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# The l402 module is baked into the image at this path.
load_module /etc/nginx/modules/libngx_l402_lib.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Ollama's OpenAI-compatible API.
    upstream ollama {
        server ollama:11434;
    }

    server {
        listen 8000;
        listen [::]:8000;
        server_name _;

        # Free: model discovery (so agents can see what's available before paying).
        location = /v1/models {
            proxy_pass http://ollama;
        }

        # Paid: every chat completion costs sats.
        location /v1/chat/completions {
            l402                      on;
            l402_amount_msat_default  100000;   # 100 sats per completion
            l402_macaroon_timeout     0;

            proxy_pass         http://ollama;
            proxy_set_header   Host $host;
            proxy_read_timeout 300s;            # LLM responses can be slow
        }

        # Agent discovery: paid routes, prices, payment backends.
        location = /.well-known/l402-services {
            l402_manifest;
        }

        location / {
            default_type text/plain;
            return 200 "ngx-l402 LLM paywall. POST /v1/chat/completions (paid).\n";
        }
    }
}
